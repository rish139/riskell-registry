name: validate
# Every pull request that touches a listing: the fields, then the repository at the pinned commit (manifest agrees, the validator passes).
on:
  pull_request:
    paths: [listings/**, scripts/**, schema/**]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Build riskell-ext (the validator)
        run: |
          git clone --quiet --depth 1 https://github.com/rish139/riskell.git ../riskell
          swift build -c release --product riskell-ext --package-path ../riskell
          echo "RISKELL_EXT=$PWD/../riskell/.build/release/riskell-ext" >> "$GITHUB_ENV"
      - name: Check the listings that changed
        run: |
          ids=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- listings | sed -E 's|listings/(.*)\.json|\1|' | tr '\n' ' ')
          [ -n "$ids" ] || { echo "no listing changed"; exit 0; }
          python3 scripts/check-listing.py --strict $ids
